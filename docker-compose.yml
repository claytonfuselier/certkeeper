services:
  certkeeper:
    #image: ghcr.io/claytonfuselier/certkeeper:latest
    # To build from source instead, comment out 'image' above and uncomment:
    build: .
    container_name: certkeeper
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"  # HTTPS web UI
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./data:/app/data
      - ./logs:/app/logs
    # .env file is optional — all settings have built-in defaults
    # Uncomment the next two lines if you use a .env file:
    # env_file:
    #   - .env
    environment:
      - NODE_ENV=production
